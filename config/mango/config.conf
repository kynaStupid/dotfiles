# Effects
blur=1
blur_layer=1
blur_optimized=1
shadows=1
layer_shadows=1
scratchpad_width_ratio=0.9
scratchpad_height_ratio=0.9

# Animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.8
fadeout_begin_opacity=0.8
tag_animation_direction=0
zoom_initial_ratio=0.3
zoom_end_ratio=1

# Theme

source-optional=@THEME_SWITCHER_ROOT@/active/mango-theme.conf

# Binds
bind=SUPER,m,quit
bind=SUPER,r,reload_config

# apps
bind=Super,Space,spawn,rofi -show combi
bind=SUPER,Return,spawn,alacritty
bind=SUPER,b,spawn,qutebrowser
bind=SUPER,g,spawn,Dorion --startup
bind=SUPER,t,spawn,zapzap --wayland

# focus
bind=SUPER,w,focusdir,up
bind=SUPER,a,focusdir,left
bind=SUPER,s,focusdir,down
bind=SUPER,d,focusdir,right
bind=SUPER,Tab,toggleoverview,0
bind=SUPER+SHIFT,Tab,toggleoverview,1

# swap
bind=SUPER+SHIFT,w,exchange_client,up
bind=SUPER+SHIFT,a,exchange_client,left
bind=SUPER+SHIFT,s,exchange_client,down
bind=SUPER+SHIFT,d,exchange_client,right

# resize
bind=SUPER+ALT,w,resizewin,+0,+100
bind=SUPER+ALT,a,resizewin,-100,+0
bind=SUPER+ALT,s,resizewin,+0,-100
bind=SUPER+ALT,d,resizewin,+100,+0

# actions
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,killclient,force
bind=SUPER,e,minimized
bind=SUPER+SHIFT,e,restore_minimized
bind=SUPER,grave,toggle_scratchpad
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,v,togglefloating

# layouts
bind=SUPER+ALT,1,setlayout,scroller
bind=SUPER+ALT,2,setlayout,center_tile
bind=SUPER+ALT,3,setlayout,dwindle
bind=SUPER+ALT,4,setlayout,deck
bind=SUPER+ALT,5,setlayout,fair
bind=SUPER+ALT,Tab,switch_layout

# tags
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
#bind=SUPER,6,view,6
#bind=SUPER,7,view,7
#bind=SUPER,8,view,8
#bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
#bind=SUPER+SHIFT,6,tag,6
#bind=SUPER+SHIFT,7,tag,7
#bind=SUPER+SHIFT,8,tag,8
#bind=SUPER+SHIFT,9,tag,9

# mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,killclient

# axis
axisbind=SUPER,UP,focusstack,next
axisbind=SUPER,DOWN,focusstack,prev
axisbind=SUPER+ALT,UP,viewtoright_have_client
axisbind=SUPER+ALT,DOWN,viewtoleft_have_client

# Environment
env=XDG_CURRENT_DESKTOP,mango
env=QT_QPA_PLATFORMTHEME,qt6ct

# Autostart
exec-once=wlr-randr --output HDMI-A-1 --mode 1920x1080@74.989998Hz >/dev/null 2>&1 &
exec-once=pipewire >/dev/null 2>&1 &
exec-once=wl-clip-persist --clipboard regular &

exec-once=lxqt-policykit-agent >/dev/null 2>&1 #&
exec-once=udiskie >/dev/null 2>&1 &
exec-once=dex -a >/dev/null 2>&1 &

exec-once=quickshell >/dev/null 2>&1 &
exec-once=mako >/dev/null 2>&1 &
exec-once=awww-daemon >/dev/null 2>&1 &

# Keyboard
repeat_rate=40
repeat_delay=250
numlockon=1
xkb_rules_layout=us

# Trackpad 
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
scroll_method=2 # edge
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=0
mouse_accel_speed=0.0

# Layouts
# tags
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:center_tile
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:deck
tagrule=id:5,layout_name:fair
#tagrule=id:6,layout_name:scroller
#tagrule=id:7,layout_name:scroller
#tagrule=id:8,layout_name:scroller
#tagrule=id:9,layout_name:scroller
circle_layout=scroller,center_tile,dwindle,deck,fair

# scroller
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# master
new_is_master=1
smartgaps=0
default_mfact=0.4
default_nmaster=1

# dwindle
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=0
dwindle_vsplit=0
dwindle_preserve_split=1

# overview
enable_hotarea=1
hotarea_size=2
hotarea_corner=2 # bottom left
ov_tab_mode=1

# Misc
xwayland_persistence=1
syncobj_enable=0
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppyfocus=1
warpcursor=1
cursor_hide_on_keypress=1
focus_cross_monitor=1
focus_cross_tag=1
single_scratchpad=1
scratchpad_cross_monitor=1
enable_floating_snap=1
snap_distance=50
cursor_hide_timeout=0
drag_tile_to_tile=1
drag_tile_small=1
drag_corner=4
drag_warp_cursor=1
